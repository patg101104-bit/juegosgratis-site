<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>juegosgratis.site - Juegos Gratis Online</title>
  <style>
    :root {
      --bg-dark: #07101a;
      --bg-card: #0b1c31;
      --bg-header: #07101a;
      --accent-cyan: #00f2fe;
      --accent-purple: #7928ca;
      --action-orange: #ff6b00;
      --text-main: #ffffff;
      --text-muted: #8899aa;
      --card-border: #1a2e48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ENCABEZADO */
    header {
      background-color: var(--bg-header);
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    /* TAMAÑO AUMENTADO DEL LOGO */
    .site-logo {
      height: 75px; /* Aumentado de 45px a 75px */
      width: auto;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent-cyan);
    }

    .search-bar input {
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      background-color: #0d1f35;
      color: var(--text-main);
      outline: none;
      width: 220px;
      font-size: 0.85rem;
    }

    .search-bar input:focus {
      border-color: var(--accent-cyan);
    }

    /* REPRODUCTOR DE JUEGO */
    #game-container {
      display: none;
      width: 100%;
      max-width: 1000px;
      margin: 1.5rem auto 0;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
    }

    #game-frame {
      width: 100%;
      height: 600px;
      border: none;
    }

    .game-controls {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #050b12;
    }

    .close-btn {
      background: #ff3355;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* CONTENIDO PRINCIPAL */
    main {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
      width: 100%;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    /* CARROUSEL / DESTACADOS */
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .featured-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      height: 160px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .featured-card:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      transform: translateY(-3px);
    }

    .featured-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .featured-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background: linear-gradient(to top, rgba(7, 16, 26, 0.95), transparent);
    }

    .featured-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    /* GRILLA PRINCIPAL */
    .grid-games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--card-border);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-purple);
      box-shadow: 0 5px 15px rgba(121, 40, 202, 0.3);
    }

    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .card-info {
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .rating {
      font-size: 0.75rem;
      color: #ffcc00;
      font-weight: bold;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #fff;
      border: none;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* PIE DE PÁGINA */
    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="logo-container">
      <img src="logo.png" alt="Juegos Gratis Site" class="site-logo">
    </div>
    
    <ul class="nav-links">
      <li><a href="#" class="active">INICIO</a></li>
      <li><a href="#">CATEGORÍAS</a></li>
      <li><a href="#">POPULARES</a></li>
      <li><a href="#">NUEVOS</a></li>
    </ul>

    <div class="search-bar">
      <input type="text" placeholder="Buscar juego...">
    </div>
  </header>

  <!-- REPRODUCTOR DE JUEGO -->
  <div id="game-container">
    <iframe id="game-frame" src="" allowfullscreen></iframe>
    <div class="game-controls">
      <h2 id="active-game-title">Cargando...</h2>
      <button class="close-btn" onclick="cerrarJuego()">✖ Cerrar Juego</button>
    </div>
  </div>

  <!-- CONTENIDO -->
  <main>
    <h2 class="section-title">Destacados</h2>
    <div class="featured-grid">
      
      <div class="featured-card" onclick="cargarJuego('https://html5.gamedistribution.com/rvvAS300/a26b2b6473ba418bb208471c66f7f329/', 'Moto X3M')">
        <img src="https://img.gamedistribution.com/a26b2b6473ba418bb208471c66f7f329-512x512.jpeg" alt="Moto X3M">
        <div class="featured-overlay">
          <div class="featured-title">Moto X3M</div>
        </div>
      </div>

      <div class="featured-card" onclick="cargarJuego('https://html5.gamedistribution.com/f920279c09d54e4f9b8c0c1efdfbe53a/', 'Subway Surfers')">
        <img src="https://img.gamedistribution.com/f920279c09d54e4f9b8c0c1efdfbe53a-512x512.jpeg" alt="Runner Arcade">
        <div class="featured-overlay">
          <div class="featured-title">Runner Arcade</div>
        </div>
      </div>

    </div>

    <h2 class="section-title">Todos los Juegos</h2>
    <div class="grid-games">
      
      <!-- TARJETA 1 -->
      <div class="card" onclick="cargarJuego('https://html5.gamedistribution.com/rvvAS300/a26b2b6473ba418bb208471c66f7f329/', 'Moto X3M')">
        <img src="https://img.gamedistribution.com/a26b2b6473ba418bb208471c66f7f329-512x512.jpeg" alt="Moto X3M">
        <div class="card-info">
          <div class="card-title">Moto X3M</div>
          <div class="card-tag">Carreras</div>
          <div class="card-bottom">
            <span class="rating">★ 4.8</span>
            <button class="btn-play">Jugar</button>
          </div>
        </div>
      </div>

      <!-- TARJETA 2 -->
      <div class="card" onclick="cargarJuego('https://html5.gamedistribution.com/f920279c09d54e4f9b8c0c1efdfbe53a/', 'Runner Arcade')">
        <img src="https://img.gamedistribution.com/f920279c09d54e4f9b8c0c1efdfbe53a-512x512.jpeg" alt="Runner Arcade">
        <div class="card-info">
          <div class="card-title">Runner Arcade</div>
          <div class="card-tag">Acción</div>
          <div class="card-bottom">
            <span class="rating">★ 4.6</span>
            <button class="btn-play">Jugar</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 juegosgratis.site - Todos los derechos reservados.</p>
  </footer>

  <script>
    function cargarJuego(url, titulo) {
      const container = document.getElementById('game-container');
      const frame = document.getElementById('game-frame');
      const titleElem = document.getElementById('active-game-title');

      frame.src = url;
      titleElem.innerText = titulo;
      container.style.display = 'block';
      container.scrollIntoView({ behavior: 'smooth' });
    }

    function cerrarJuego() {
      const container = document.getElementById('game-container');
      const frame = document.getElementById('game-frame');

      frame.src = '';
      container.style.display = 'none';
    }
  </script>
</body>
</html>
