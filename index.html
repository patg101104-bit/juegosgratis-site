<!DOCTYPE html>

<html lang="es">


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JuegosGratis - Juegos Online Gratis</title>

<meta
    name="description"
    content="Juega videojuegos gratis directamente desde tu navegador. Sin descargas."
>

<style>

    :root {
        --bg-dark: #07101a;
        --bg-header: #081522;
        --bg-card: #0c1b2b;
        --card-border: #1b354d;

        --accent-cyan: #00f2fe;
        --accent-purple: #7928ca;
        --accent-pink: #ff3355;

        --text-main: #f1f5f9;
        --text-muted: #8fa3b8;
    }


    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            sans-serif;
    }


    html {
        min-height: 100%;
        background: var(--bg-dark);
    }


    body {
        background: var(--bg-dark);
        color: var(--text-main);
        min-height: 100vh;
    }


    /* ==============================
       HEADER
    ============================== */

    header {
        background: var(--bg-header);

        border-bottom:
            1px solid var(--card-border);

        position: sticky;
        top: 0;

        z-index: 1000;
    }


    .header-inner {
        max-width: 1200px;

        margin: auto;

        padding: 15px 20px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 20px;
    }


   .logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    line-height: 0;
    width: 190px;
    height: 55px;
}

.logo img {
    display: block;
    width: 190px !important;
    height: auto !important;
    max-width: 190px !important;
    max-height: 55px !important;
    object-fit: contain;
}

    .logo span {
        color: var(--accent-cyan);
    }


    .nav-links {
        display: flex;

        gap: 15px;

        list-style: none;
    }


    .nav-links button {
        background: none;

        border: none;

        color: var(--text-muted);

        cursor: pointer;

        font-weight: 700;

        padding: 5px;
    }


    .nav-links button:hover {
        color: var(--accent-cyan);
    }


    .search-box input {
        width: 220px;

        padding: 10px 15px;

        border-radius: 20px;

        border:
            1px solid var(--card-border);

        background: #0d1f35;

        color: white;

        outline: none;
    }


    .search-box input:focus {
        border-color: var(--accent-cyan);
    }


    /* ==============================
       MAIN
    ============================== */

    main {
        max-width: 1200px;

        margin: auto;

        padding: 30px 20px;
    }


    .hero {
        padding: 50px 30px;

        border-radius: 15px;

        margin-bottom: 30px;

        background:
            linear-gradient(
                135deg,
                rgba(0,242,254,.08),
                rgba(121,40,202,.15)
            );

        border:
            1px solid var(--card-border);
    }


    .hero h1 {
        font-size: 3rem;

        margin-bottom: 15px;
    }


    .hero h1 span {
        color: var(--accent-cyan);
    }


    .hero p {
        color: var(--text-muted);

        max-width: 650px;

        line-height: 1.6;
    }


    /* ==============================
       ADS
    ============================== */

    .ad-container {
        min-height: 90px;

        border:
            1px dashed #29445c;

        display: flex;

        justify-content: center;

        align-items: center;

        color: #52677c;

        margin: 30px 0;

        border-radius: 10px;

        text-align: center;
    }


    /* ==============================
       SECTION
    ============================== */

    .section-title {
        margin-bottom: 20px;
    }


    /* ==============================
       GAME GRID
    ============================== */

    .games-grid {
        display: grid;

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(180px, 1fr)
            );

        gap: 20px;
    }


    /* ==============================
       GAME CARD
    ============================== */

    .game-card {
        background: var(--bg-card);

        border:
            1px solid var(--card-border);

        border-radius: 12px;

        overflow: hidden;

        cursor: pointer;

        transition: .2s;
    }


    .game-card:hover {
        transform: translateY(-5px);

        border-color: var(--accent-cyan);

        box-shadow:
            0 10px 25px
            rgba(0,242,254,.15);
    }


    .game-image {
        width: 100%;

        aspect-ratio: 1 / .75;

        background: #000;
    }


    .game-image img {
        width: 100%;

        height: 100%;

        object-fit: cover;

        display: block;
    }


    .game-info {
        padding: 15px;
    }


    .game-title {
        font-weight: 800;

        margin-bottom: 5px;

        line-height: 1.3;
    }


    .game-category {
        color: var(--text-muted);

        font-size: .8rem;

        margin-bottom: 10px;
    }


    .play-button {
        background:
            linear-gradient(
                135deg,
                var(--accent-cyan),
                var(--accent-purple)
            );

        border: none;

        color: white;

        padding: 7px 12px;

        border-radius: 6px;

        font-weight: 800;

        cursor: pointer;
    }


    /* ==============================
       PLAYER
    ============================== */

    #game-container {
        display: none;

        position: fixed;

        inset: 0;

        z-index: 9999;

        background:
            rgba(0,0,0,.96);

        padding: 20px;

        overflow: auto;
    }


    .game-player {
        width: 100%;

        max-width: 1100px;

        margin: auto;

        background: #050b12;

        border:
            1px solid var(--accent-cyan);

        border-radius: 12px;

        overflow: hidden;
    }


    .player-header {
        min-height: 55px;

        padding: 10px 15px;

        display: flex;

        justify-content: space-between;

        align-items: center;

        gap: 10px;

        background: #081522;
    }


    #game-title {
        font-weight: 800;

        color: white;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
    }


    .player-buttons {
        display: flex;

        align-items: center;

        gap: 8px;

        flex-shrink: 0;
    }


    .fullscreen-btn {
        background: #16283a;

        color: white;

        border:
            1px solid #29445c;

        padding: 8px 12px;

        border-radius: 6px;

        font-size: 18px;

        font-weight: 800;

        cursor: pointer;
    }


    .fullscreen-btn:hover {
        background: #203b53;

        border-color:
            var(--accent-cyan);
    }


    .close-btn {
        background:
            var(--accent-pink);

        color: white;

        border: none;

        padding: 8px 15px;

        border-radius: 6px;

        font-weight: 800;

        cursor: pointer;
    }


    .close-btn:hover {
        filter: brightness(1.1);
    }


    #game-frame {
        width: 100%;

        height: 650px;

        border: none;

        display: block;

        background: #000;
    }


    /* ==============================
       FOOTER
    ============================== */

    footer {
        margin-top: 50px;

        padding: 30px;

        text-align: center;

        color: var(--text-muted);

        border-top:
            1px solid var(--card-border);
    }


    /* ==============================
       MOBILE
    ============================== */

    @media(max-width:700px) {

        .header-inner {
            flex-wrap: wrap;
        }


        .nav-links {
            order: 3;

            width: 100%;

            justify-content: center;
        }


        .search-box {
            flex: 1;

            min-width: 150px;
        }


        .search-box input {
            width: 100%;
        }


        .hero h1 {
            font-size: 2.2rem;
        }


        .games-grid {
            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
        }


        #game-container {
            padding: 0;
        }


        .game-player {
            min-height: 100vh;

            border-radius: 0;

            border-left: 0;

            border-right: 0;
        }


        .player-header {
            min-height: 55px;

            padding: 10px;
        }


        #game-frame {
            height:
                calc(100vh - 55px);
        }


        .fullscreen-btn {
            padding: 7px 10px;
        }


        .close-btn {
            padding: 7px 10px;
        }

    }

</style>
```

</head>

<body>

```
<!-- ==============================
     HEADER
============================== -->

<header>

    <div class="header-inner">


       <a
    href="/"
    class="logo"
    aria-label="JuegosGratis - Inicio"
>
    <img
        src="/logo.png"
        alt="JuegosGratis"
    >
</a>

        <nav>

            <ul class="nav-links">


                <li>

                    <button
                        type="button"
                        onclick="mostrarTodos()"
                    >

                        INICIO

                    </button>

                </li>


                <li>

                    <button
                        type="button"
                        onclick="mostrarPopulares()"
                    >

                        POPULARES

                    </button>

                </li>


                <li>

                    <button
                        type="button"
                        onclick="mostrarNuevos()"
                    >

                        NUEVOS

                    </button>

                </li>


            </ul>

        </nav>


        <div class="search-box">

            <input
                id="searchInput"
                type="search"
                placeholder="Buscar juego..."
                oninput="buscarEnCatalogo(this.value)"
            >

        </div>


    </div>

</header>



<!-- ==============================
     MAIN
============================== -->

<main>


    <section class="hero">


        <h1>

            JUEGA
            <span>GRATIS.</span>

        </h1>


        <p>

            Descubre videojuegos gratuitos y
            juega directamente desde tu navegador.
            Sin descargas.

        </p>


    </section>



    <div class="ad-container">

        ESPACIO PUBLICITARIO

    </div>



    <h2 class="section-title">

        🎮 Juegos disponibles

    </h2>



    <div
        id="gamesGrid"
        class="games-grid"
    ></div>


</main>



<!-- ==============================
     PLAYER
============================== -->

<div id="game-container">


    <div class="game-player">


        <div class="player-header">


            <div id="game-title">

                Juego

            </div>


            <div class="player-buttons">


                <button
                    class="fullscreen-btn"
                    type="button"
                    onclick="pantallaCompletaJuego()"
                    title="Pantalla completa"
                    aria-label="Pantalla completa"
                >

                    ⛶

                </button>


                <button
                    class="close-btn"
                    type="button"
                    onclick="cerrarJuego()"
                >

                    ✕ CERRAR

                </button>


            </div>


        </div>


        <!--
            PLAYGAMA

            Permisos necesarios para los juegos.

            speaker-selection NO se incluye porque
            el navegador lo reconoce como una
            característica no válida.
        -->

        <iframe
            id="game-frame"
            src="about:blank"

            allow="
                fullscreen;
                accelerometer;
                camera;
                clipboard-read;
                clipboard-write;
                screen-wake-lock;
                web-share;
                geolocation;
                gyroscope;
                microphone;
                xr-spatial-tracking;
                autoplay;
                encrypted-media;
                picture-in-picture;
                payment;
                publickey-credentials-get;
                publickey-credentials-create;
                storage-access;
                attribution-reporting;
                browsing-topics
            "

            allowfullscreen

            scrolling="no"

            frameborder="0"
        >
        </iframe>


    </div>

</div>



<!-- ==============================
     FOOTER
============================== -->

<footer>

    🎮 JUEGOSGRATIS

    <br>
    <br>

    Juegos gratuitos para jugar
    desde tu navegador.

</footer>



<!-- ==============================
     CARGAR CATÁLOGO
============================== -->

<script src="juegos2.js"></script>



<!-- ==============================
     FUNCIONES DE LA PÁGINA
============================== -->

<script>


    const gamesGrid =
        document.getElementById(
            "gamesGrid"
        );


    const gameContainer =
        document.getElementById(
            "game-container"
        );


    const gameFrame =
        document.getElementById(
            "game-frame"
        );


    const gameTitle =
        document.getElementById(
            "game-title"
        );



    /* ==============================
       MOSTRAR JUEGOS
    ============================== */

    function mostrarJuegos(lista) {

        gamesGrid.innerHTML = "";


        if (
            !lista ||
            lista.length === 0
        ) {

            gamesGrid.innerHTML = `

                <p style="
                    color:#8fa3b8;
                    padding:20px;
                ">

                    No encontramos juegos.

                </p>

            `;

            return;

        }


        lista.forEach(juego => {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "game-card";


            card.innerHTML = `

                <div class="game-image">

                    <img
                        src="${juego.imagen}"
                        alt="${juego.nombre}"
                        loading="lazy"
                    >

                </div>


                <div class="game-info">

                    <div class="game-title">

                        ${juego.nombre}

                    </div>


                    <div class="game-category">

                        ${juego.categoria}

                    </div>


                    <button
                        class="play-button"
                        type="button"
                    >

                        ▶ JUGAR

                    </button>

                </div>

            `;


            card.addEventListener(
                "click",
                () =>
                    abrirJuego(
                        juego.id
                    )
            );


            gamesGrid.appendChild(
                card
            );

        });

    }



    /* ==============================
       ABRIR JUEGO
    ============================== */

    function abrirJuego(id) {


        const juego =
            obtenerJuegoPorId(id);


        if (!juego) {

            console.error(
                "No se encontró el juego:",
                id
            );

            return;

        }


        console.log(
            "🎮 Abriendo:",
            juego.nombre
        );


        gameTitle.textContent =
            juego.nombre;


        gameFrame.src =
            juego.url;


        gameContainer.style.display =
            "block";


        document.body.style.overflow =
            "hidden";

    }



    /* ==============================
       PANTALLA COMPLETA
    ============================== */

    function pantallaCompletaJuego() {

        if (!gameFrame) {
            return;
        }


        if (
            document.fullscreenElement
        ) {

            if (
                document.exitFullscreen
            ) {

                document.exitFullscreen();

            }

            return;

        }


        if (
            gameFrame.requestFullscreen
        ) {

            gameFrame.requestFullscreen();

        } else {

            console.warn(
                "El navegador no permite pantalla completa mediante esta función."
            );

        }

    }



    /* ==============================
       CERRAR JUEGO
    ============================== */

    function cerrarJuego() {


        gameFrame.src =
            "about:blank";


        gameContainer.style.display =
            "none";


        document.body.style.overflow =
            "";


        if (
            document.fullscreenElement &&
            document.exitFullscreen
        ) {

            document.exitFullscreen();

        }

    }



    /* ==============================
       INICIO
    ============================== */

    function mostrarTodos() {

        mostrarJuegos(
            obtenerJuegos()
        );

    }



    /* ==============================
       POPULARES
    ============================== */

    function mostrarPopulares() {

        mostrarJuegos(
            obtenerJuegosDestacados()
        );

    }



    /* ==============================
       NUEVOS
    ============================== */

    function mostrarNuevos() {

        mostrarJuegos(
            obtenerJuegosNuevos()
        );

    }



    /* ==============================
       BUSCADOR
    ============================== */

    function buscarEnCatalogo(texto) {

        mostrarJuegos(
            buscarJuegos(texto)
        );

    }



    /* ==============================
       CUANDO EL CATÁLOGO ESTÁ LISTO
    ============================== */

    document.addEventListener(
        "catalogoCargado",
        function() {

            console.log(
                "🎮 Catálogo listo para mostrar."
            );


            mostrarTodos();

        }
    );


</script>
