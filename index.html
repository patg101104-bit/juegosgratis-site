<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JuegosGratis</title>

    <style>

        :root {
            --bg-dark: #07101a;
            --bg-header: #081522;
            --bg-card: #0c1b2b;
            --card-border: #1b354d;
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --accent-pink: #ff3355;
            --text-main: #f1f5f9;
            --text-muted: #8fa3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* HEADER */

        header {
            background: var(--bg-header);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 15px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: 900;
        }

        .logo span {
            color: var(--accent-cyan);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 700;
        }

        .nav-links button:hover {
            color: var(--accent-cyan);
        }

        .search-box input {
            width: 220px;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            background: #0d1f35;
            color: white;
            outline: none;
        }

        /* MAIN */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .hero {
            padding: 50px 30px;
            border-radius: 15px;
            margin-bottom: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,242,254,.08),
                    rgba(121,40,202,.15)
                );

            border: 1px solid var(--card-border);
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: var(--accent-cyan);
        }

        .hero p {
            color: var(--text-muted);
            max-width: 650px;
            line-height: 1.6;
        }

        /* ADS */

        .ad-container {
            height: 90px;
            border: 1px dashed #29445c;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #52677c;
            margin: 30px 0;
            border-radius: 10px;
        }

        /* SECTION */

        .section-title {
            margin-bottom: 20px;
        }

        /* GAME GRID */

        .games-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(180px, 1fr)
                );

            gap: 20px;
        }

        /* GAME CARD */

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: .2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow:
                0 10px 25px
                rgba(0,242,254,.15);
        }

        .game-image {
            width: 100%;
            aspect-ratio: 1 / .75;
            background: #000;
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
        }

        .game-title {
            font-weight: 800;
            margin-bottom: 5px;
        }

        .game-category {
            color: var(--text-muted);
            font-size: .8rem;
            margin-bottom: 10px;
        }

        .play-button {
            background:
                linear-gradient(
                    135deg,
                    var(--accent-cyan),
                    var(--accent-purple)
                );

            border: none;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: 800;
        }

        /* PLAYER */

        #game-container {
            display: none;

            position: fixed;
            inset: 0;

            z-index: 9999;

            background:
                rgba(0,0,0,.96);

            padding: 20px;
            overflow: auto;
        }

        .game-player {
            max-width: 1100px;
            margin: auto;

            background: #050b12;

            border:
                1px solid var(--accent-cyan);

            border-radius: 12px;
            overflow: hidden;
        }

        .player-header {
            height: 55px;
            padding: 10px 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #081522;
        }

        #game-title {
            font-weight: 800;
        }

        .close-btn {
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
        }

        #game-frame {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
        }

        /* FOOTER */

        footer {
            margin-top: 50px;
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
        }

        /* MOBILE */

        @media(max-width:700px) {

            .header-inner {
                flex-wrap: wrap;
            }

            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .search-box {
                flex: 1;
            }

            .search-box input {
                width: 100%;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .games-grid {
                grid-template-columns:
                    repeat(2,1fr);
                gap: 10px;
            }

            #game-container {
                padding: 0;
            }

            .game-player {
                min-height: 100vh;
                border-radius: 0;
            }

            #game-frame {
                height:
                    calc(100vh - 55px);
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header-inner">

        <a
            href="#"
            class="logo"
        >
            🎮 JUEGOS<span>GRATIS</span>
        </a>


        <nav>

            <ul class="nav-links">

                <li>
                    <button
                        onclick="mostrarTodos()"
                    >
                        INICIO
                    </button>
                </li>

                <li>
                    <button
                        onclick="mostrarPopulares()"
                    >
                        POPULARES
                    </button>
                </li>

                <li>
                    <button
                        onclick="mostrarNuevos()"
                    >
                        NUEVOS
                    </button>
                </li>

            </ul>

        </nav>


        <div class="search-box">

            <input
                id="searchInput"
                type="search"
                placeholder="Buscar juego..."
                oninput="buscarEnCatalogo(this.value)"
            >

        </div>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <section class="hero">

        <h1>
            JUEGA
            <span>GRATIS.</span>
        </h1>

        <p>
            Descubre videojuegos gratuitos y
            juega directamente desde tu navegador.
            Sin descargas.
        </p>

    </section>



    <div class="ad-container">

        ESPACIO PUBLICITARIO

    </div>



    <h2 class="section-title">
        🎮 Juegos disponibles
    </h2>


    <div
        id="gamesGrid"
        class="games-grid"
    ></div>


</main>



<!-- =====================================================
     GAME PLAYER
===================================================== -->

<div id="game-container">

    <div class="game-player">


        <div class="player-header">

            <div id="game-title">
                Juego
            </div>


            <button
                class="close-btn"
                onclick="cerrarJuego()"
            >
                ✕ CERRAR
            </button>

        </div>


        <iframe
            id="game-frame"
            src="about:blank"
            allowfullscreen
            scrolling="none"
            frameborder="0"
        ></iframe>


    </div>

</div>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    🎮 JUEGOSGRATIS

    <br><br>

    Juegos gratuitos para jugar desde tu navegador.

</footer>



<!-- =====================================================
     JUEGOS.JS
===================================================== -->

<script src="juegos.js"></script>



<!-- =====================================================
     FUNCIONES PRINCIPALES
===================================================== -->

<script>


/* =====================================================
   CARGAR JUEGOS
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderizarJuegos(
            obtenerJuegos()
        );

    }
);



/* =====================================================
   CREAR TARJETA
===================================================== */

function crearTarjetaJuego(juego) {

    const card =
        document.createElement("div");


    card.className =
        "game-card";


    card.innerHTML = `

        <div class="game-image">

            <img
                src="${juego.imagen}"
                alt="${juego.nombre}"
                loading="lazy"
            >

        </div>


        <div class="game-info">

            <div class="game-title">
                ${juego.nombre}
            </div>


            <div class="game-category">
                ${juego.categoria}
            </div>


            <button
                class="play-button"
                type="button"
            >
                🎮 JUGAR
            </button>

        </div>

    `;


    card.addEventListener(
        "click",
        function() {

            cargarJuego(
                juego.url,
                juego.nombre
            );

        }
    );


    return card;

}



/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarJuegos(lista) {

    const grid =
        document.getElementById(
            "gamesGrid"
        );


    grid.innerHTML = "";


    lista.forEach(
        function(juego) {

            grid.appendChild(
                crearTarjetaJuego(juego)
            );

        }
    );

}



/* =====================================================
   🔥 ESTA ES LA FUNCIÓN QUE BUSCABAS
===================================================== */

function cargarJuego(url, nombre) {


    console.log(
        "🎮 Intentando cargar:",
        nombre
    );


    const container =
        document.getElementById(
            "game-container"
        );


    const frame =
        document.getElementById(
            "game-frame"
        );


    const title =
        document.getElementById(
            "game-title"
        );


    /*
    -----------------------------------------------------
    IMPORTANTE

    Utilizamos la URL REAL de nuestro dominio.

    No inventamos /games/nombre.
    -----------------------------------------------------
    */

    const paginaOrigen =
        window.location.origin + "/";


    /*
    -----------------------------------------------------
    Agregamos gd_sdk_referrer_url
    -----------------------------------------------------
    */

    let gameUrl = url;


    if (
        !url.includes(
            "gd_sdk_referrer_url="
        )
    ) {

        const separador =
            url.includes("?")
                ? "&"
                : "?";


        gameUrl =
            url +
            separador +
            "gd_sdk_referrer_url=" +
            encodeURIComponent(
                paginaOrigen
            );

    }


    console.log(
        "🔗 URL final:",
        gameUrl
    );


    title.textContent =
        nombre;


    /*
    Primero establecemos
    el iframe.
    */

    frame.src =
        gameUrl;


    /*
    Después mostramos
    el reproductor.
    */

    container.style.display =
        "block";


    document.body.style.overflow =
        "hidden";

}



/* =====================================================
   CERRAR JUEGO
===================================================== */

function cerrarJuego() {


    const container =
        document.getElementById(
            "game-container"
        );


    const frame =
        document.getElementById(
            "game-frame"
        );


    frame.src =
        "about:blank";


    container.style.display =
        "none";


    document.body.style.overflow =
        "";

}



/* =====================================================
   BUSCAR
===================================================== */

function buscarEnCatalogo(texto) {


    const resultados =
        buscarJuegos(texto);


    renderizarJuegos(
        resultados
    );

}



/* =====================================================
   MOSTRAR TODOS
===================================================== */

function mostrarTodos() {

    renderizarJuegos(
        obtenerJuegos()
    );

}



/* =====================================================
   POPULARES
===================================================== */

function mostrarPopulares() {


    const juegos =
        obtenerJuegos().filter(
            juego =>
                juego.rating >= 4.7
        );


    renderizarJuegos(
        juegos
    );

}



/* =====================================================
   NUEVOS
===================================================== */

function mostrarNuevos() {


    renderizarJuegos(
        obtenerJuegosNuevos()
    );

}



/* =====================================================
   ESC PARA CERRAR
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            cerrarJuego();

        }

    }
);


</script>


</body>

</html>
